[package]
name = "stoked-escrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# A standalone crate: no parent Cargo workspace.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "stoked_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", default-features = false, features = ["associated_token", "token", "token_2022", "solana-v3"] }

[dev-dependencies]
litesvm = "=0.18.2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "4"
spl-associated-token-account-interface = "2"
spl-token-2022-interface = "2"
spl-token-metadata-interface = "0.8"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-log-ix-name"))'] }
